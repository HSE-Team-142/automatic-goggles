model:
  model_name: openai-community/gpt2
  max_length: 512
  metric_features: 256
  gates: 256
  mlp_hidden_features: 256
  mlp_hidden_layers: 3
  mlp_dropout: 0.0
  token_dropout: 0.15
  residual: true

optimizer:
  learning_rate: 1e-3
  weight_decay: 1e-2
  grad_clip: 1.0

trainer:
  device: null
  seed: 42
  epochs: 5

data:
  batch_size: 16
  eval_batch_size: 16
  num_workers: 0
